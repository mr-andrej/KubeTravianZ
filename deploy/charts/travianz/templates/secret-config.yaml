# DEV-ONLY plaintext secrets. In AWS this file is replaced by a SealedSecret
# with the same name and keys (see deploy repo), so the game templates never
# change between environments.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels: {{- include "travianz.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-password: {{ .Values.secrets.dbPassword | quote }}
  db-root-password: {{ .Values.secrets.dbRootPassword | quote }}
  cron-key: {{ .Values.secrets.cronKey | quote }}
  mh-password: {{ .Values.secrets.mhPassword | quote }}
  support-password: {{ .Values.secrets.supportPassword | quote }}
  admin-password: {{ .Values.secrets.adminPassword | quote }}
---
# config.php carries SQL_PASS and CRON_KEY, so it lives in a Secret, not a
# ConfigMap. Rendered from files/config.php.tpl (proven working config).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-config
  labels: {{- include "travianz.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.php: |
    {{- include "travianz.configPhp" . | nindent 4 }}
