# MariaDB primary. Single writer; all game traffic goes to the primary
# Service. The replica (doc 04) is added in a later iteration.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-mariadb
  labels:
    {{- include "travianz.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
spec:
  serviceName: {{ .Release.Name }}-mariadb-primary
  replicas: 1
  selector:
    matchLabels:
      {{- include "travianz.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mariadb
  template:
    metadata:
      labels:
        {{- include "travianz.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mariadb
    spec:
      containers:
        - name: mariadb
          image: {{ .Values.mariadb.image }}
          args:
            # legacy game code needs permissive SQL mode (compose parity)
            - --sql_mode=
          env:
            - name: MARIADB_DATABASE
              value: {{ .Values.mariadb.auth.database | quote }}
            - name: MARIADB_USER
              value: {{ .Values.mariadb.auth.user | quote }}
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: db-password
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: db-root-password
          ports:
            - containerPort: 3306
          livenessProbe:
            exec:
              command: [ "healthcheck.sh", "--connect", "--innodb_initialized" ]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: [ "healthcheck.sh", "--connect" ]
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        {{- if .Values.mariadb.storageClassName }}
        storageClassName: {{ .Values.mariadb.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mariadb.storageSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mariadb-primary
  labels:
    {{- include "travianz.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    {{- include "travianz.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
