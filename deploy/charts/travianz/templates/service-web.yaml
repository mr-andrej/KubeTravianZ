apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "travianz.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    {{- include "travianz.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
