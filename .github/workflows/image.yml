name: Image

on:
  push:
    branches: [ master, test ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/travianz
          SHA=${GITHUB_SHA::7}
          if [ "${GITHUB_REF_NAME}" = "master" ]; then
            TAGS="${IMAGE}:latest,${IMAGE}:${SHA}"
          else
            TAGS="${IMAGE}:test,${IMAGE}:test-${SHA}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      # amd64 keeps local dev (x86 laptops) working from the same tag;
      # arm64 is what the t4g Graviton nodes run.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
